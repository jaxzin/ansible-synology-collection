# Test-only Ansible config. Makes the collection's roles resolvable by short name
# from a bare repo checkout (no `ansible-galaxy collection install` required), so
# `ansible-playbook tests/converge_shares.yml` works straight from the repo.
[defaults]
roles_path = ../roles
inventory = ./inventory.ini
retry_files_enabled = False
# DSM ships a self-signed cert on :5001; the roles pass validate_certs=false, but
# keep host key checking off for the local connection too.
host_key_checking = False
