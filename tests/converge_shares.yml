---
# Example / test converge for tafeen.synology.syno_add_shares via the DSM HTTP API.
#
# Usage (from the tests/ directory, which carries the ansible.cfg that resolves
# the collection's roles by short name from a bare checkout):
#
#   export DSM_ACCOUNT='<administrators-group DSM account>'
#   export DSM_PASSWORD='<password>'
#   # export DSM_OTP_CODE='123456'   # only if the account has 2FA
#
#   ansible-playbook --syntax-check converge_shares.yml
#   ansible-playbook converge_shares.yml                    # validate-only (no changes)
#   ansible-playbook converge_shares.yml -e converge=true   # apply
#   ansible-playbook converge_shares.yml -e converge=true   # idempotency: changed=0
#
# The DSM API is driven from THIS host over HTTPS (see inventory.ini) — the play
# runs on localhost, not on the NAS.
- name: Converge Synology shares over the DSM HTTP API
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Manage the Time Machine share
      ansible.builtin.include_role:
        name: syno_add_shares
      vars:
        syno_shares:
          - name: "Time Machine Backups"
            description: "Time Machine target"
            volume: /volume1
            rights:
              RW: [alice]
            enable_time_machine: true
            quota_gb: 4000          # example per-share quota; set to your volume
            recycle: false
